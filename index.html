  <style>

r-radius:14px;padding:12px}.message.mine{border-color:var(--mint);background:#fffdf3}.message-body{flex:1;min-width:0}.message-body p{margin:5px 0;white-space:pre-wrap;word-break:break-word}.chat-form{display:flex;gap:10px;margin-top:15px}.chat-form textarea{flex:1;resize:vertical;min-height:48px}@media(max-width:850px){.shell{display:block}.side{padding:16px;gap:15px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.user{display:none}.main{padding:24px 16px}.stats,.grid{grid-template-columns:1fr}.top{align-items:flex-start}.top h1{font-size:28px}}

import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
import{getFirestore,collection,addDoc,doc,getDoc,updateDoc,deleteDoc,setDoc,onSnapshot,query,orderBy,serverTimestamp,arrayUnion,arrayRemove}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';
import{getStorage,ref,uploadBytes,getDownloadURL,deleteObject}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-storage.js';

// Pega aquí la configuración que Firebase te entrega al registrar una app web.
const firebaseConfig={apiKey:'AIzaSyDnL8eOd1lYlhxO7Eiqtux85yX1GF6JyyQ',authDomain:'boomyard-projects.firebaseapp.com',projectId:'boomyard-projects',storageBucket:'boomyard-projects.firebasestorage.app',messagingSenderId:'511170456486',appId:'1:511170456486:web:d049b814f0e3df365f3d67'};
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb),storage=getStorage(fb),provider=new GoogleAuthProvider();
const OWNER_EMAIL='juan32progamer@gmail.com';
const state={lang:localStorage.getItem('boomyardLanguage')==='es'?'es':'en',dailyPeriod:'all',reportDateFilter:'',view:'Daily',projects:[],tasks:[],goals:[],feedback:[],dailyReports:[],messages:[],users:[],profile:null,settings:{green:'#0b4d2a',mint:'#f4c430'},user:null};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uiSource=new WeakMap();
function uiText(raw){if(!raw.includes(' / '))return raw;let result=raw.replaceAll('Photos / Fotos / PDF','Photos and PDF / Fotos y PDF').replaceAll('hours / horas',state.lang==='es'?'horas':'hours').replaceAll('tasks / tareas',state.lang==='es'?'tareas':'tasks');if(result!==raw&&!result.includes(' / '))return result;const match=result.match(/^(\s*)([\s\S]*?)\s+\/\s+([\s\S]*?)(\s*)$/);return match?match[1]+(state.lang==='es'?match[3]:match[2])+match[4]:result}
function translateUI(root){const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);while(walk.nextNode()){const node=walk.currentNode;if(node.parentElement?.closest('.report-text,.archive-preview,.user-content,.message-body p,script,style'))continue;const raw=uiSource.get(node)??node.nodeValue;uiSource.set(node,raw);if(raw.includes(' / '))node.nodeValue=uiText(raw)}for(const el of root.querySelectorAll?.('[placeholder],[aria-label]')||[]){for(const name of ['placeholder','aria-label']){if(!el.hasAttribute(name))continue;const key=name+'Raw';const raw=el.dataset[key]||el.getAttribute(name);el.dataset[key]=raw;el.setAttribute(name,uiText(raw))}}document.documentElement.lang=state.lang;document.title='Boomyard Projects | '+(state.lang==='es'?'Gestión de proyectos':'Project management');document.querySelectorAll('.languageSelect').forEach(el=>el.value=state.lang)}
function setLanguage(lang){state.lang=lang==='es'?'es':'en';localStorage.setItem('boomyardLanguage',state.lang);if(state.user)render();translateUI(document.body);if(!$('#modal').classList.contains('hidden'))translateUI($('#modal'))}
document.querySelectorAll('.languageSelect').forEach(el=>el.onchange=()=>setLanguage(el.value));
translateUI(document.body);
const localDay=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const date=v=>{if(!v)return state.lang==='es'?'Sin fecha':'No date';const d=/^\d{4}-\d{2}-\d{2}$/.test(v)?new Date(Number(v.slice(0,4)),Number(v.slice(5,7))-1,Number(v.slice(8,10))):new Date(v);return Number.isNaN(d.getTime())?(state.lang==='es'?'Sin fecha':'No date'):d.toLocaleDateString(state.lang==='es'?'es-HN':'en-US',state.lang==='es'?{day:'numeric',month:'short',year:'numeric'}:{month:'short',day:'numeric',year:'numeric'})};
const nav=['Daily','Report archive','Proyectos','Rendimiento','Metas','Feedback','Chat','Mi perfil'];
const isAdmin=()=>state.user?.email?.toLowerCase()===OWNER_EMAIL.toLowerCase();
const viewLabel={Daily:'Daily / Diario','Report archive':'Daily reports / Reportes diarios',Proyectos:'Projects / Proyectos',Rendimiento:'Performance / Rendimiento',Metas:'Goals / Metas',Feedback:'Feedback / Comentarios',Chat:'Chat / Mensajes','Mi perfil':'My profile / Mi perfil',Configuración:'Settings / Configuración'};
const statusLabel=v=>uiText(({'Pendiente':'Pending / Pendiente','En curso':'In progress / En curso','En revisión':'In review / En revisión','En pausa':'Paused / En pausa','Hecho':'Done / Hecho','Finalizado':'Completed / Finalizado'}[v]||v||''));
const projectTypeLabel=v=>uiText(({'Arquitectura':'Architecture / Arquitectura','Paisajismo':'Landscape design / Paisajismo','Piscinas y patios':'Pools and patios / Piscinas y patios','Urbanismo':'Urban planning / Urbanismo'}[v]||v||''));
const feedbackTypeLabel=v=>uiText(({'Cliente':'Client / Cliente','Equipo':'Team / Equipo','Revisión':'Review / Revisión'}[v]||v||''));
const goalPeriodLabel=v=>uiText(({'Semanal':'Weekly / Semanal','Mensual':'Monthly / Mensual'}[v]||v||''));
function applyTheme(){document.documentElement.style.setProperty('--green',state.settings.green||'#0b4d2a');document.documentElement.style.setProperty('--mint',state.settings.mint||'#f4c430')}

$('#googleLogin').onclick=()=>signInWithPopup(auth,provider).catch(e=>showLoginError(e.message));
$('#logout').onclick=()=>signOut(auth);$('#closeModal').onclick=()=>$('#modal').classList.add('hidden');
onAuthStateChanged(auth,user=>{if(!user){state.user=null;$('#login').classList.remove('hidden');$('#app').classList.add('hidden');return}state.user=user;$('#userEmail').textContent=user.email;$('#loginError').classList.add('hidden');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');render();listen();setDoc(doc(db,'users',user.uid),{email:user.email,displayName:user.displayName||user.email.split('@')[0],googlePhoto:user.photoURL||'',lastLogin:serverTimestamp()},{merge:true}).catch(e=>console.warn('No se pudo actualizar el perfil:',e))});
function showLoginError(text){$('#loginError').textContent=text;$('#loginError').classList.remove('hidden')}
async function cleanupCarlosLozano(){const mark=doc(db,'appSettings','cleanupCarlosLozano');if((await getDoc(mark)).exists())return;const p=state.projects.find(x=>String(x.name||'').trim().toLowerCase()==='carlos lozano'&&String(x.client||'').trim().toLowerCase()==='bear'&&x.dueDate==='2026-09-29');if(!p)return;const related=state.tasks.filter(t=>t.projectId===p.id);await Promise.all(related.map(t=>deleteDoc(doc(db,'tasks',t.id))));await deleteDoc(doc(db,'projects',p.id));await setDoc(mark,{completed:true,deletedProjectId:p.id,completedAt:serverTimestamp()});}
function listen(){[['projects','projects'],['tasks','tasks'],['goals','goals'],['feedback','feedback'],['dailyReports','dailyReports'],['messages','chatMessages']].forEach(([key,name])=>onSnapshot(query(collection(db,name),orderBy('createdAt','desc')),s=>{state[key]=s.docs.map(d=>({id:d.id,...d.data()}));if(key==='projects'){state[key]=state[key].filter(p=>!(String(p.name||'').trim().toLowerCase()==='carlos lozano'&&String(p.client||'').trim().toLowerCase()==='bear'));cleanupCarlosLozano().catch(e=>console.error('Cleanup:',e))}render()}));onSnapshot(collection(db,'users'),s=>{state.users=s.docs.map(d=>({id:d.id,...d.data()}));state.profile=state.users.find(x=>x.id===state.user.uid)||null;render()});onSnapshot(doc(db,'appSettings','theme'),s=>{if(s.exists())state.settings={...state.settings,...s.data()};applyTheme();render()})}
function go(v){state.view=v;render()}
function render(){if(!state.user)return;const menu=isAdmin()?[...nav,'Configuración']:nav;$('#nav').innerHTML=menu.map(n=>`<button data-view="${n}" class="${state.view===n?'active':''}">${viewLabel[n]||n}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));$('#title').textContent=viewLabel[state.view]||state.view;const sub={Daily:'Daily work summary / Resumen del trabajo diario.','Report archive':'Open reports from every day / Abre los reportes de todos los días.',Proyectos:'Design, deliveries and tasks / Diseño, entregas y tareas.',Rendimiento:'Biweekly and monthly progress / Progreso quincenal y mensual.',Metas:'Weekly and monthly goals / Metas semanales y mensuales.',Feedback:'Client and team feedback / Comentarios de clientes y del equipo.',Chat:'Team messages / Mensajes del equipo.','Mi perfil':'Your name and photo / Tu nombre y fotografía.',Configuración:'Administration and appearance / Administración y apariencia.'};$('#subtitle').textContent=sub[state.view];const btn=$('#newButton');btn.classList.toggle('hidden',['Report archive','Rendimiento','Configuración','Chat','Mi perfil'].includes(state.view));btn.textContent=state.view==='Daily'?'+ Daily report / Reporte diario':state.view==='Proyectos'?'+ New project / Nuevo proyecto':state.view==='Metas'?'+ New goal / Nueva meta':'+ Add feedback / Agregar comentario';btn.onclick=()=>openForm(state.view);$('#content').innerHTML=state.view==='Daily'?dailyView():state.view==='Report archive'?dailyArchiveView():state.view==='Proyectos'?projectsView():state.view==='Rendimiento'?performanceView():state.view==='Metas'?goalsView():state.view==='Feedback'?feedbackView():state.view==='Chat'?chatView():state.view==='Mi perfil'?profileView():settingsView();bindActions();translateUI($('#app'))}
function dailyView(){
  const today=localDay(new Date()),active=state.projects.filter(p=>p.status!=='Finalizado'),pending=state.tasks.filter(t=>t.status!=='Hecho'),done=state.tasks.filter(t=>t.status==='Hecho');
  const dueToday=state.tasks.filter(t=>t.dueDate===today),monthStart=new Date();monthStart.setDate(monthStart.getDate()-30);
  const periodTasks=state.tasks.filter(t=>new Date(t.dueDate||t.createdAt?.toDate?.()||0)>=monthStart),periodDone=periodTasks.filter(t=>t.status==='Hecho').length,performance=periodTasks.length?Math.round(periodDone/periodTasks.length*100):0;
  const latest=sortedDailyReports()[0];
  return `<section class="hero"><span><span>DAILY / DIARIO</span> · ${new Date().toLocaleDateString(state.lang==='es'?'es-HN':'en-US',{weekday:'long',month:'long',day:'numeric'})}</span><div><strong>${performance}%</strong><p>Last 30 days · ${periodDone} of ${periodTasks.length} tasks completed. / Últimos 30 días: ${periodDone} de ${periodTasks.length} tareas completadas.</p></div><div class="progress"><i style="width:${performance}%"></i></div></section>
  <div class="stats" style="margin-top:15px"><div class="card stat"><span class="muted">Active projects / Proyectos activos</span><strong>${active.length}</strong></div><div class="card stat"><span class="muted">Pending / Pendientes</span><strong>${pending.length}</strong></div><div class="card stat"><span class="muted">Due today / Para hoy</span><strong>${dueToday.length}</strong></div></div>
  <div class="grid" style="margin-top:15px">
    <section class="card"><h2>Projects / Proyectos</h2>${active.slice(0,5).map(p=>`<div class="row"><span>${esc(p.name)}<small class="muted" style="display:block">${esc(p.client||projectTypeLabel(p.type)||'')}</small></span><span class="tag">${esc(statusLabel(p.status))}</span></div>`).join('')||'<p class="muted">No active projects. / No hay proyectos activos.</p>'}</section>
    <section class="card"><h2>Today's tasks / Tareas de hoy</h2>${dueToday.map(t=>`<div class="row"><span>${esc(t.title)}<small class="muted" style="display:block">${esc(t.assignee||'Unassigned / Sin responsable')}</small></span><span class="tag">${esc(statusLabel(t.status))}</span></div>`).join('')||'<p class="muted">No tasks due today. / No hay tareas para hoy.</p>'}</section>
    <section class="card"><h2>Goals / Metas</h2>${state.goals.slice(0,5).map(g=>{const p=Math.min(100,Math.round((g.current||0)/(g.target||1)*100));return `<div style="margin-bottom:16px"><b>${esc(g.title)}</b><div class="progress" style="margin-top:8px"><i style="width:${p}%"></i></div><small class="muted">${p}% · ${esc(goalPeriodLabel(g.period))}</small></div>`}).join('')||'<p class="muted">No goals registered. / No hay metas registradas.</p>'}</section>
  </div>
  <div class="grid" style="margin-top:15px">
    <section class="card"><h2>Latest daily report / Último reporte diario</h2>${latest?`<p><b>Completed / Logros:</b> ${esc(latest.accomplished)}</p><p><b>Next / Pendiente:</b> ${esc(latest.nextSteps)}</p><p><b>Blockers / Bloqueos:</b> ${esc(latest.blockers||'None / Ninguno')}</p><small class="muted">${esc(latest.author||'Team / Equipo')} · ${date(latest.reportDate)}</small>${canEditDaily(latest)?`<div style="margin-top:12px"><button class="btn alt editDaily" data-id="${esc(latest.id)}">Edit / Editar</button></div>`:''}`:'<p class="muted">No daily report yet. / Todavía no hay reporte diario.</p>'}</section>
    <section class="card"><h2>Recent feedback / Comentarios recientes</h2>${state.feedback.slice(0,3).map(f=>`<div class="row"><span><b>${esc(f.author)}</b><small class="muted" style="display:block">${esc(f.message)}</small></span><span class="stars">${'★'.repeat(f.rating||5)}</span></div>`).join('')||'<p class="muted">No recent feedback. / No hay comentarios recientes.</p>'}</section>
    <section class="card"><h2>Summary / Resumen</h2><p><b>${done.length}</b> tasks completed in total / tareas terminadas en total.</p><p><b>${state.goals.length}</b> active goals / metas activas registradas.</p><p><b>${state.feedback.length}</b> feedback items received / comentarios recibidos.</p></section>
  </div><section class="card" style="margin-top:15px"><div class="top"><div><h2>Daily report records / Registro de reportes diarios</h2><p class="muted">Open reports from any day / Abre reportes de cualquier día.</p></div><button class="btn alt openArchive" type="button">Open all reports / Abrir todos los reportes</button></div></section>`;
}

function canEditDaily(r){return isAdmin()||[r.createdBy,r.authorEmail].some(e=>e?.toLowerCase()===state.user?.email?.toLowerCase())}
function sortedDailyReports(){return [...state.dailyReports].sort((a,b)=>String(b.reportDate||'').localeCompare(String(a.reportDate||''))||(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0))}
function dailyArchiveView(){
  const now=new Date(),today=localDay(now),weekStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7));
  const periodStart=state.dailyPeriod==='week'?localDay(weekStart):state.dailyPeriod==='fortnight'?localDay(new Date(now.getFullYear(),now.getMonth(),now.getDate()<=15?1:16)):'';
  const reports=sortedDailyReports().filter(r=>{const day=r.reportDate||(r.createdAt?.toDate?.()?localDay(r.createdAt.toDate()):'');return (!periodStart||day>=periodStart&&day<=today)&&(!state.reportDateFilter||day===state.reportDateFilter)});
  const options=[['all','All dates / Todas las fechas'],['week','This week / Esta semana'],['fortnight','This fortnight / Esta quincena']];
  let previous='';
  return `<section class="card"><div class="top archive-head"><div><h2>Daily report records / Registro de reportes diarios</h2><p class="muted">${reports.length} <span>reports / reportes</span> · <span>Select any record to read it / Selecciona un registro para leerlo.</span></p></div><div class="archive-filters"><label>Period / Periodo<select id="dailyPeriod">${options.map(([value,label])=>`<option value="${value}" ${value===state.dailyPeriod?'selected':''}>${label}</option>`).join('')}</select></label><label>Date / Fecha<input id="reportDateFilter" type="date" value="${esc(state.reportDateFilter)}"></label><button class="btn alt clearReportDate" type="button">Clear / Borrar</button></div></div><div class="list">${reports.length?reports.map(r=>{const day=r.reportDate||(r.createdAt?.toDate?.()?localDay(r.createdAt.toDate()):'');const heading=day!==previous?`<h3 class="archive-date">${date(day)}</h3>`:'';previous=day;return `${heading}<article class="row archive-row"><div><b>${esc(r.author||r.authorEmail||'Team / Equipo')}</b><small class="muted" style="display:block">${date(day)} · ${Number(r.hours)||0} <span>hours / horas</span></small><p class="archive-preview">${esc(r.accomplished||uiText('No summary / Sin resumen'))}</p></div><button class="btn alt openDaily" type="button" data-id="${esc(r.id)}">Open report / Abrir reporte</button></article>`}).join(''):'<p class="muted">No reports match these filters. / No hay reportes con estos filtros.</p>'}</div></section>`;
}
function openDaily(id){
  const r=state.dailyReports.find(x=>x.id===id);if(!r)return;
  $('#modalTitle').textContent='Daily report / Reporte diario · '+date(r.reportDate||(r.createdAt?.toDate?.()?localDay(r.createdAt.toDate()):''));
  $('#dynamicForm').onsubmit=null;
  $('#dynamicForm').innerHTML=`<div class="report-detail"><p><b>Author / Autor:</b> ${esc(r.author||r.authorEmail||'Team / Equipo')}</p><p><b>Date / Fecha:</b> ${date(r.reportDate||(r.createdAt?.toDate?.()?localDay(r.createdAt.toDate()):''))}</p><p><b>Completed / Logros</b></p><p class="report-text">${esc(r.accomplished||'—')}</p><p><b>Next steps / Próximos pasos</b></p><p class="report-text">${esc(r.nextSteps||'—')}</p><p><b>Blockers / Bloqueos</b></p><p class="report-text">${esc(r.blockers||uiText('None / Ninguno'))}</p><p><b>Hours / Horas:</b> ${Number(r.hours)||0}</p>${canEditDaily(r)?`<button class="btn editOpenedDaily" type="button">Edit report / Editar reporte</button>`:''}</div>`;
  $('#modal').classList.remove('hidden');translateUI($('#modal'));
  const edit=$('.editOpenedDaily');if(edit)edit.onclick=()=>editDaily(id);
}
function editDaily(id){
  const r=state.dailyReports.find(x=>x.id===id);if(!r||!canEditDaily(r))return;
  showModal('Edit daily report / Editar reporte diario',`<label>Date / Fecha<input name="reportDate" type="date" required value="${esc(r.reportDate||localDay(new Date()))}"></label><label>Completed / Logros<textarea name="accomplished" required>${esc(r.accomplished)}</textarea></label><label>Next / Siguiente<textarea name="nextSteps" required>${esc(r.nextSteps)}</textarea></label><label>Blockers / Bloqueos<textarea name="blockers">${esc(r.blockers||'')}</textarea></label><label>Hours / Horas<input name="hours" type="number" min="0" step="0.5" value="${Number(r.hours)||0}"></label>`,async d=>updateDoc(doc(db,'dailyReports',id),{reportDate:d.reportDate,accomplished:d.accomplished,nextSteps:d.nextSteps,blockers:d.blockers,hours:Number(d.hours)||0,updatedAt:serverTimestamp(),updatedBy:state.user.email}));
}
function projectsView(){const done=state.tasks.filter(t=>t.status==='Hecho').length;return `<div class="stats"><div class="card stat"><span class="muted">Active projects / Proyectos activos</span><strong>${state.projects.filter(p=>p.status!=='Finalizado').length}</strong></div><div class="card stat"><span class="muted">Pending tasks / Tareas pendientes</span><strong>${state.tasks.length-done}</strong></div><div class="card stat"><span class="muted">Completed tasks / Tareas terminadas</span><strong>${done}</strong></div></div><div class="toolbar"><input id="search" placeholder="Search project or client / Buscar proyecto o cliente"><select id="statusFilter"><option value="Todos">All / Todos</option><option value="En curso">In progress / En curso</option><option value="En revisión">In review / En revisión</option><option value="En pausa">Paused / En pausa</option><option value="Finalizado">Completed / Finalizado</option></select></div><div id="projectList" class="list">${projectRows(state.projects)}</div>`}
function projectRows(items){return items.length?items.map(p=>{const pt=state.tasks.filter(t=>t.projectId===p.id),done=pt.filter(t=>t.status==='Hecho').length,progress=pt.length?Math.round(done/pt.length*100):0;return `<article class="card"><div class="row" style="padding:0;border:0"><div><h2>${esc(p.name)}</h2><p class="muted">${esc(p.client||projectTypeLabel(p.type))}</p></div><div><span class="tag">${esc(statusLabel(p.status))}</span>${isAdmin()?`<div style="margin-top:8px"><button class="btn alt editProject" data-id="${p.id}">Edit / Editar</button> <button class="btn alt deleteItem" data-type="projects" data-id="${p.id}">Delete / Eliminar</button></div>`:''}</div></div><div class="progress"><i style="width:${progress}%"></i></div><p class="muted">${done}/${pt.length} <span>tasks / tareas</span> · <span>Due / Entrega</span> ${date(p.dueDate)}</p><button class="btn alt addTask" data-id="${p.id}">+ Task / Tarea</button> <button class="btn alt addFiles" data-id="${p.id}">📎 Photos / Fotos / PDF</button>${attachmentsView(p.attachments)}<div class="list" style="margin-top:12px">${pt.map(t=>`<div class="row"><span>${esc(t.title)}<small class="muted" style="display:block">${esc(t.assignee||'Unassigned / Sin responsable')} · ${date(t.dueDate)}</small></span><span><select class="taskStatus" data-id="${t.id}">${['Pendiente','En curso','En revisión','Hecho'].map(s=>`<option value="${s}" ${s===t.status?'selected':''}>${statusLabel(s)}</option>`).join('')}</select>${isAdmin()?` <button class="btn alt deleteItem" data-type="tasks" data-id="${t.id}">×</button>`:''}</span></div>`).join('')}</div></article>`}).join(''):'<div class="card empty">No projects yet. / Todavía no hay proyectos.</div>'}
function attachmentsView(files=[]){return files?.length?`<div class="attachments">${files.map(f=>f.type?.startsWith('image/')?`<a href="${esc(f.url)}" target="_blank" rel="noopener"><img class="attachment-img" src="${esc(f.url)}" alt="${esc(f.name)}"></a>`:`<a class="file-link" href="${esc(f.url)}" target="_blank" rel="noopener">📄 ${esc(f.name)}</a>`).join('')}</div>`:''}
async function uploadProjectFiles(projectId,fileList){
  const files=[...fileList];if(!files.length)return;
  for(const file of files){
    if(!file.type.startsWith('image/')&&file.type!=='application/pdf')throw new Error(uiText('Only images and PDFs are allowed. / Solo se permiten imágenes y PDF.'));
    if(file.size>15*1024*1024)throw new Error(file.name+' '+uiText('exceeds 15 MB / supera el límite de 15 MB.'));
    const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`projects/${projectId}/${Date.now()}-${safe}`;
    const fileRef=ref(storage,path);await uploadBytes(fileRef,file);const url=await getDownloadURL(fileRef);
    await updateDoc(doc(db,'projects',projectId),{attachments:arrayUnion({name:file.name,type:file.type,url,path,uploadedBy:state.user.email,uploadedAt:new Date().toISOString()})});
  }
}
function openFiles(projectId){
  showModal('Add photos or PDF / Agregar fotos o PDF',`<label>Select files / Seleccionar archivos<input name="files" type="file" accept="image/*,application/pdf" multiple required></label><p class="muted">You can select multiple photos and PDFs. Maximum 15 MB per file. / Puedes elegir varias fotos y PDF. Máximo 15 MB por archivo.</p><div id="uploadStatus" class="upload-status"></div>`,async()=>{
    const input=$('#dynamicForm input[type=file]'),status=$('#uploadStatus');status.textContent='Uploading files... / Subiendo archivos...';
    await uploadProjectFiles(projectId,input.files);status.textContent='Files saved. / Archivos guardados.';
  });
}
function performanceView(){const now=new Date(),start=new Date();start.setDate(now.getDate()-14);const pt=state.tasks.filter(t=>new Date(t.dueDate||t.createdAt?.toDate?.()||0)>=start),done=pt.filter(t=>t.status==='Hecho').length,p=pt.length?Math.round(done/pt.length*100):0,late=pt.filter(t=>t.status!=='Hecho'&&t.dueDate&&new Date(t.dueDate)<now).length;return `<section class="hero"><span>BIWEEKLY PERFORMANCE / DESEMPEÑO QUINCENAL</span><div><strong>${p}%</strong><p>${done} of ${pt.length} tasks completed / ${done} de ${pt.length} tareas completadas.</p></div><div class="progress"><i style="width:${p}%"></i></div></section><div class="stats" style="margin-top:15px"><div class="card stat"><span class="muted">Period tasks / Tareas del periodo</span><strong>${pt.length}</strong></div><div class="card stat"><span class="muted">Completed / Completadas</span><strong>${done}</strong></div><div class="card stat"><span class="muted">Overdue / Atrasadas</span><strong>${late}</strong></div></div>`}
function goalsView(){return `<div class="grid">${state.goals.length?state.goals.map(g=>{const p=Math.min(100,Math.round((Number(g.current)||0)/(Number(g.target)||100)*100));return `<article class="card"><span class="tag">${esc(goalPeriodLabel(g.period))}</span><h2>${esc(g.title)}</h2><strong style="font-size:32px">${p}%</strong><div class="progress"><i style="width:${p}%"></i></div><p class="muted">Due / Fecha límite: ${date(g.dueDate)}</p><label>Completion / Avance: <output class="goalPercent">${p}%</output><input class="goalProgress" aria-label="Completion percentage / Porcentaje de avance" data-id="${g.id}" type="range" min="0" max="100" step="1" value="${p}" style="width:100%"></label>${isAdmin()?`<button class="btn alt deleteItem" data-type="goals" data-id="${g.id}" style="margin-top:10px">Delete / Eliminar</button>`:''}</article>`}).join(''):'<div class="card empty">No goals yet. / Todavía no hay metas.</div>'}</div>`}
function feedbackView(){return `<div class="grid">${state.feedback.length?state.feedback.map(f=>`<article class="card"><span class="tag">${esc(feedbackTypeLabel(f.category))}</span><h2>${esc(f.author)}</h2><div class="stars">${'★'.repeat(f.rating||5)}</div><p>${esc(f.message)}</p><small class="muted">${esc(state.projects.find(p=>p.id===f.projectId)?.name||'General feedback / Comentarios generales')}</small>${isAdmin()?`<br><button class="btn alt deleteItem" data-type="feedback" data-id="${f.id}" style="margin-top:10px">Delete / Eliminar</button>`:''}</article>`).join(''):'<div class="card empty">No feedback yet. / Todavía no hay comentarios.</div>'}</div>`}
function userProfile(uid){return state.users.find(u=>u.id===uid)||{}}
function avatarOf(uid,fallback=''){const u=userProfile(uid);return u.avatar||u.googlePhoto||fallback||'https://ui-avatars.com/api/?background=0b4d2a&color=f4c430&name=User'}
function chatView(){const list=[...state.messages].reverse();return `<section class="card"><div class="chat-box" id="chatBox">${list.length?list.map(m=>{const u=userProfile(m.uid),mine=m.uid===state.user.uid;return `<article class="message ${mine?'mine':''}"><img class="avatar" src="${esc(avatarOf(m.uid,m.avatar))}" alt=""><div class="message-body"><b>${esc(u.displayName||m.author||m.email||'User / Usuario')}</b><p>${esc(m.text)}</p><small class="muted">${m.createdAt?.toDate?.().toLocaleString('es-HN')||'Sending... / Enviando...'}</small></div>${mine||isAdmin()?`<button class="btn alt deleteChat" data-id="${m.id}">×</button>`:''}</article>`}).join(''):'<div class="empty">No messages yet. / Todavía no hay mensajes.</div>'}</div><form id="chatForm" class="chat-form"><textarea name="text" maxlength="1000" required placeholder="Message the team... / Escribe un mensaje al equipo..."></textarea><button class="btn">Send / Enviar</button></form></section>`}
function profileView(){const p=state.profile||{},avatar=avatarOf(state.user.uid,state.user.photoURL);return `<div class="card" style="max-width:600px"><img class="avatar large" src="${esc(avatar)}" alt="Avatar"><h2>${esc(p.displayName||state.user.displayName||'User / Usuario')}</h2><p class="muted">${esc(state.user.email)}</p><form id="profileForm" class="form"><label>Display name / Nombre visible<input name="displayName" required value="${esc(p.displayName||state.user.displayName||'')}"></label><label>New photo / Nueva fotografía<input name="avatarFile" type="file" accept="image/*"></label><small class="muted"><span>JPG, PNG or WEBP. / JPG, PNG o WEBP.</span> <span>Maximum 5 MB / Máximo 5 MB</span></small><button class="btn">Save profile / Guardar perfil</button></form></div>`}
async function saveProfile(form){const name=form.displayName.value.trim(),file=form.avatarFile.files[0],data={displayName:name,updatedAt:serverTimestamp()};if(file){if(!file.type.startsWith('image/'))throw new Error(uiText('Select an image. / Selecciona una imagen.'));if(file.size>5*1024*1024)throw new Error(uiText('Image exceeds 5 MB. / La imagen supera 5 MB.'));const fileRef=ref(storage,`avatars/${state.user.uid}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`);await uploadBytes(fileRef,file);data.avatar=await getDownloadURL(fileRef)}await setDoc(doc(db,'users',state.user.uid),data,{merge:true})}
function settingsView(){if(!isAdmin())return '<div class="card">Restricted access. / Acceso restringido.</div>';return `<div class="card"><h2>Appearance / Apariencia</h2><form id="themeForm" class="form"><label>Primary color / Color principal<input name="green" type="color" value="${esc(state.settings.green)}"></label><label>Secondary color / Color secundario<input name="mint" type="color" value="${esc(state.settings.mint)}"></label><button class="btn">Save colors / Guardar colores</button></form></div><div class="card" style="margin-top:15px"><h2>Administration / Administración</h2><p class="muted">Your account can edit and delete information created by others. Every deletion asks for confirmation. / Tu cuenta puede editar y eliminar información creada por otros usuarios. Todas las eliminaciones piden confirmación.</p></div>`}
function bindActions(){const dailyPeriod=$('#dailyPeriod');if(dailyPeriod)dailyPeriod.onchange=()=>{state.dailyPeriod=dailyPeriod.value;render()};const reportDate=$('#reportDateFilter');if(reportDate)reportDate.onchange=()=>{state.reportDateFilter=reportDate.value;render()};const clearDate=$('.clearReportDate');if(clearDate)clearDate.onclick=()=>{state.reportDateFilter='';render()};const archive=$('.openArchive');if(archive)archive.onclick=()=>go('Report archive');document.querySelectorAll('.openDaily').forEach(b=>b.onclick=()=>openDaily(b.dataset.id));document.querySelectorAll('.editDaily').forEach(b=>b.onclick=()=>editDaily(b.dataset.id));const s=$('#search');if(s)s.oninput=()=>{$('#projectList').innerHTML=projectRows(state.projects.filter(p=>`${p.name} ${p.client}`.toLowerCase().includes(s.value.toLowerCase())&&($('#statusFilter').value==='Todos'||p.status===$('#statusFilter').value)));bindActions()};const f=$('#statusFilter');if(f)f.onchange=()=>s.dispatchEvent(new Event('input'));document.querySelectorAll('.addTask').forEach(b=>b.onclick=()=>openTask(b.dataset.id));document.querySelectorAll('.addFiles').forEach(b=>b.onclick=()=>openFiles(b.dataset.id));document.querySelectorAll('.taskStatus').forEach(x=>x.onchange=()=>updateDoc(doc(db,'tasks',x.dataset.id),{status:x.value,completedAt:x.value==='Hecho'?serverTimestamp():null}));document.querySelectorAll('.goalProgress').forEach(x=>{x.oninput=()=>{x.closest('label').querySelector('.goalPercent').textContent=x.value+'%'};x.onchange=async()=>{const g=state.goals.find(item=>item.id===x.dataset.id);try{await updateDoc(doc(db,'goals',x.dataset.id),{current:Math.round((Number(g?.target)||100)*Number(x.value))/100})}catch(err){alert(uiText('Could not update progress / No se pudo actualizar el avance')+': '+err.message);render()}}});document.querySelectorAll('.editProject').forEach(b=>b.onclick=()=>editProject(b.dataset.id));document.querySelectorAll('.deleteItem').forEach(b=>b.onclick=()=>removeItem(b.dataset.type,b.dataset.id));const tf=$('#themeForm');if(tf)tf.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));await setDoc(doc(db,'appSettings','theme'),d,{merge:true});alert(uiText('Colors updated. / Colores actualizados.'))};const cf=$('#chatForm');if(cf)cf.onsubmit=async e=>{e.preventDefault();const text=e.target.text.value.trim();if(!text)return;e.target.text.value='';await addDoc(collection(db,'chatMessages'),{text,uid:state.user.uid,email:state.user.email,author:state.profile?.displayName||state.user.displayName||state.user.email,avatar:avatarOf(state.user.uid,state.user.photoURL),createdAt:serverTimestamp()})};document.querySelectorAll('.deleteChat').forEach(b=>b.onclick=async()=>{const m=state.messages.find(x=>x.id===b.dataset.id);if(m&&(m.uid===state.user.uid||isAdmin())&&confirm(uiText('Delete this message? / ¿Eliminar este mensaje?')))await deleteDoc(doc(db,'chatMessages',m.id))});const pf=$('#profileForm');if(pf)pf.onsubmit=async e=>{e.preventDefault();try{await saveProfile(e.target);alert(uiText('Profile updated. / Perfil actualizado.'))}catch(err){alert(uiText('Could not save / No se pudo guardar')+': '+err.message)}}}
async function removeItem(type,id){if(!isAdmin())return;if(!confirm(uiText('Delete this item? This action cannot be undone. / ¿Eliminar este elemento? Esta acción no se puede deshacer.')))return;if(type==='projects'){const related=state.tasks.filter(t=>t.projectId===id);await Promise.all(related.map(t=>deleteDoc(doc(db,'tasks',t.id))));}await deleteDoc(doc(db,type,id));}
function editProject(id){const p=state.projects.find(x=>x.id===id);if(!p||!isAdmin())return;showModal('Edit project / Editar proyecto',`<label>Name / Nombre<input name="name" required value="${esc(p.name)}"></label><label>Client / Cliente<input name="client" value="${esc(p.client||'')}"></label><label>Type / Tipo<select name="type">${['Arquitectura','Paisajismo','Piscinas y patios','Urbanismo'].map(x=>`<option value="${x}" ${x===p.type?'selected':''}>${projectTypeLabel(x)}</option>`).join('')}</select></label><label>Status / Estado<select name="status">${['En curso','En revisión','En pausa','Finalizado'].map(x=>`<option value="${x}" ${x===p.status?'selected':''}>${statusLabel(x)}</option>`).join('')}</select></label><label>Due date / Fecha objetivo<input name="dueDate" type="date" value="${esc(p.dueDate||'')}"></label><label>Scope / Alcance<textarea name="description">${esc(p.description||'')}</textarea></label>`,async d=>updateDoc(doc(db,'projects',id),d));}
function openForm(view){if(view==='Daily')showModal('New daily report / Nuevo reporte diario',`<label>Date / Fecha<input name="reportDate" type="date" required value="${localDay(new Date())}"></label><label>What was completed today? / ¿Qué se logró hoy?<textarea name="accomplished" required></textarea></label><label>What's next? / ¿Qué sigue?<textarea name="nextSteps" required></textarea></label><label>Blockers or issues / Bloqueos o problemas<textarea name="blockers"></textarea></label><label>Hours worked / Horas trabajadas<input name="hours" type="number" min="0" step="0.5"></label>`,async d=>addDoc(collection(db,'dailyReports'),{...d,hours:Number(d.hours)||0,author:state.user.displayName||state.user.email,authorEmail:state.user.email,createdAt:serverTimestamp(),createdBy:state.user.email}));if(view==='Proyectos')showModal('New project / Nuevo proyecto',`<label>Name / Nombre<input name="name" required></label><label>Client / Cliente<input name="client"></label><label>Type / Tipo<select name="type"><option value="Arquitectura">Architecture / Arquitectura</option><option value="Paisajismo">Landscape design / Paisajismo</option><option value="Piscinas y patios">Pools and patios / Piscinas y patios</option><option value="Urbanismo">Urban planning / Urbanismo</option></select></label><label>Due date / Fecha objetivo<input name="dueDate" type="date"></label><label>Scope / Alcance<textarea name="description"></textarea></label><label>Photos or PDF / Fotos o PDF<input name="files" type="file" accept="image/*,application/pdf" multiple></label>`,async d=>{const files=$('#dynamicForm input[type=file]').files;delete d.files;const created=await addDoc(collection(db,'projects'),{...d,status:'En curso',attachments:[],createdAt:serverTimestamp(),createdBy:state.user.email});await uploadProjectFiles(created.id,files)});if(view==='Metas')showModal('New goal / Nueva meta',`<label>Goal / Meta<input name="title" required></label><label>Period / Periodo<select name="period"><option value="Semanal">Weekly / Semanal</option><option value="Mensual">Monthly / Mensual</option></select></label><label>Due date / Fecha límite<input name="dueDate" type="date"></label><p class="muted">Set progress from 0% to 100% after creating the goal. / Ajusta el avance de 0% a 100% después de crearla.</p>`,async d=>addDoc(collection(db,'goals'),{...d,target:100,current:0,unit:'%',createdAt:serverTimestamp(),createdBy:state.user.email}));if(view==='Feedback')showModal('Add feedback / Registrar comentario',`<label>From / De parte de<input name="author" required></label><label>Project / Proyecto<select name="projectId"><option value="">General / General</option>${state.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`)}</select></label><label>Source / Origen<select name="category"><option value="Cliente">Client / Cliente</option><option value="Equipo">Team / Equipo</option><option value="Revisión">Review / Revisión</option></select></label><label>Rating / Calificación<select name="rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label>Comment / Comentario<textarea name="message" required></textarea></label>`,async d=>addDoc(collection(db,'feedback'),{...d,rating:Number(d.rating),createdAt:serverTimestamp(),createdBy:state.user.email}))}
function openTask(projectId){showModal('New task / Nueva tarea',`<label>Task / Tarea<input name="title" required></label><label>Assignee / Responsable<input name="assignee"></label><label>Due date / Fecha de entrega<input name="dueDate" type="date"></label>`,async d=>addDoc(collection(db,'tasks'),{...d,projectId,status:'Pendiente',createdAt:serverTimestamp(),completedAt:null,createdBy:state.user.email}))}
function showModal(title,fields,save){$('#modalTitle').textContent=title;$('#dynamicForm').innerHTML=fields+'<button class="btn" type="submit">Save / Guardar</button>';$('#modal').classList.remove('hidden');translateUI($('#modal'));$('#dynamicForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await save(d);$('#modal').classList.add('hidden')}catch(err){alert(uiText('Could not save / No se pudo guardar')+': '+err.message)}}}
  </script>
</body></html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Boomyard Projects</title>
  <style>
    :root{--ink:#172525;--green:#153936;--mint:#b8d89b;--line:#dce5e1;--bg:#f4f6f5;--muted:#627570}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card,.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 5px 20px #173b3710}.login-card{width:min(430px,100%);padding:38px;text-align:center}.logo{display:inline-grid;place-items:center;width:50px;height:50px;border-radius:14px;background:var(--green);color:var(--mint);font-size:26px;font-weight:900}.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--green);color:#fff;font-weight:700;cursor:pointer}.btn.alt{background:#fff;color:var(--green);border:1px solid var(--line)}.shell{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.side{background:var(--green);color:white;padding:24px;display:flex;flex-direction:column;gap:30px}.brand{font-weight:900;letter-spacing:.12em}.brand small{display:block;color:#b7ccc6;font-size:11px;margin-top:4px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#bbcec8;padding:12px;border-radius:10px;cursor:pointer}.nav button.active{background:#2a5650;color:white;font-weight:700}.user{margin-top:auto;font-size:13px;color:#bbcec8;word-break:break-all}.main{padding:36px 44px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:28px}.top h1{margin:0;font-size:34px}.sub{color:var(--muted);margin-top:8px}.stats,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:20px}.stat strong{display:block;font-size:34px;margin-top:10px}.muted{color:var(--muted)}.toolbar{display:flex;gap:10px;margin:22px 0}.toolbar input,.toolbar select,input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;max-width:100%}.toolbar input{flex:1}.list{display:grid;gap:12px}.row{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;gap:16px;justify-content:space-between;align-items:center}.tag{padding:6px 10px;border-radius:999px;background:#e9f1ed;color:#315e54;font-size:12px;font-weight:700}.progress{height:13px;background:#e3eae6;border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;background:#3d8171}.hero{background:var(--green);color:white;border-radius:24px;padding:30px}.hero .progress{background:#315b55}.hero .progress>i{background:var(--mint)}.hero strong{font-size:56px}.form{display:grid;gap:12px}.form label{font-size:13px;font-weight:700}.form label>*{width:100%;margin-top:5px}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px}.modal-box{background:#fff;width:min(520px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:26px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.stars{color:#e8a510}.notice{padding:14px;border-radius:10px;background:#fff4d8;color:#745400;margin-bottom:18px}.empty{text-align:center;padding:50px;color:var(--muted)}@media(max-width:850px){.shell{display:block}.side{padding:16px;gap:15px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.user{display:none}.main{padding:24px 16px}.stats,.grid{grid-template-columns:1fr}.top{align-items:flex-start}.top h1{font-size:28px}}
  </style>
</head>
<body>
<section id="login" class="login"><div class="login-card"><span class="logo">B</span><h1>Boomyard Projects</h1><p class="muted">Acceso exclusivo para empleados autorizados.</p><button id="googleLogin" class="btn">Continuar con Google</button><p id="loginError" class="notice hidden"></p></div></section>
<div id="app" class="shell hidden"><aside class="side"><div class="brand">BOOMYARD<small>PROJECTS</small></div><nav class="nav" id="nav"></nav><div class="user"><span id="userEmail"></span><br><button id="logout" class="btn alt" style="margin-top:10px">Cerrar sesión</button></div></aside><main class="main"><header class="top"><div><h1 id="title">Proyectos</h1><div class="sub" id="subtitle"></div></div><button id="newButton" class="btn">+ Nuevo proyecto</button></header><div id="content"></div></main></div>
<div id="modal" class="modal hidden"><div class="modal-box"><div class="modal-head"><h2 id="modalTitle"></h2><button class="btn alt" id="closeModal">Cerrar</button></div><form id="dynamicForm" class="form"></form></div></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
import{getFirestore,collection,addDoc,doc,getDoc,updateDoc,onSnapshot,query,orderBy,serverTimestamp}from'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

// Pega aquí la configuración que Firebase te entrega al registrar una app web.
const firebaseConfig={apiKey:'AIzaSyDnL8eOd1lYlhxO7Eiqtux85yX1GF6JyyQ',authDomain:'boomyard-projects.firebaseapp.com',projectId:'boomyard-projects',storageBucket:'boomyard-projects.firebasestorage.app',messagingSenderId:'511170456486',appId:'1:511170456486:web:d049b814f0e3df365f3d67'};
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb),provider=new GoogleAuthProvider();
const OWNER_EMAIL='juan32progamer@gmail.com';
const state={view:'Proyectos',projects:[],tasks:[],goals:[],feedback:[],user:null};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=v=>v?new Date(v).toLocaleDateString('es-HN',{day:'numeric',month:'short',year:'numeric'}):'Sin fecha';
const nav=['Proyectos','Rendimiento','Metas','Feedback'];

$('#googleLogin').onclick=()=>signInWithPopup(auth,provider).catch(e=>showLoginError(e.message));
$('#logout').onclick=()=>signOut(auth);$('#closeModal').onclick=()=>$('#modal').classList.add('hidden');
onAuthStateChanged(auth,user=>{if(!user){state.user=null;$('#login').classList.remove('hidden');$('#app').classList.add('hidden');return}state.user=user;$('#userEmail').textContent=user.email;$('#loginError').classList.add('hidden');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');listen();render()});
function showLoginError(text){$('#loginError').textContent=text;$('#loginError').classList.remove('hidden')}
function listen(){[['projects','projects'],['tasks','tasks'],['goals','goals'],['feedback','feedback']].forEach(([key,name])=>onSnapshot(query(collection(db,name),orderBy('createdAt','desc')),s=>{state[key]=s.docs.map(d=>({id:d.id,...d.data()}));render()}))}
function go(v){state.view=v;render()}
function render(){if(!state.user)return;$('#nav').innerHTML=nav.map(n=>`<button data-view="${n}" class="${state.view===n?'active':''}">${n}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));$('#title').textContent=state.view;const sub={Proyectos:'Seguimiento de diseño, entregas y tareas.',Rendimiento:'Cumplimiento quincenal o mensual.',Metas:'Objetivos semanales y mensuales.',Feedback:'Comentarios de clientes, equipo y revisiones.'};$('#subtitle').textContent=sub[state.view];const btn=$('#newButton');btn.classList.toggle('hidden',state.view==='Rendimiento');btn.textContent=state.view==='Proyectos'?'+ Nuevo proyecto':state.view==='Metas'?'+ Nueva meta':'+ Registrar feedback';btn.onclick=()=>openForm(state.view);$('#content').innerHTML=state.view==='Proyectos'?projectsView():state.view==='Rendimiento'?performanceView():state.view==='Metas'?goalsView():feedbackView();bindActions()}
function projectsView(){const done=state.tasks.filter(t=>t.status==='Hecho').length;return `<div class="stats"><div class="card stat"><span class="muted">Proyectos activos</span><strong>${state.projects.filter(p=>p.status!=='Finalizado').length}</strong></div><div class="card stat"><span class="muted">Tareas pendientes</span><strong>${state.tasks.length-done}</strong></div><div class="card stat"><span class="muted">Tareas terminadas</span><strong>${done}</strong></div></div><div class="toolbar"><input id="search" placeholder="Buscar proyecto o cliente"><select id="statusFilter"><option>Todos</option><option>En curso</option><option>En revisión</option><option>En pausa</option><option>Finalizado</option></select></div><div id="projectList" class="list">${projectRows(state.projects)}</div>`}
function projectRows(items){return items.length?items.map(p=>{const pt=state.tasks.filter(t=>t.projectId===p.id),done=pt.filter(t=>t.status==='Hecho').length,progress=pt.length?Math.round(done/pt.length*100):0;return `<article class="card"><div class="row" style="padding:0;border:0"><div><h2>${esc(p.name)}</h2><p class="muted">${esc(p.client||p.type)}</p></div><span class="tag">${esc(p.status)}</span></div><div class="progress"><i style="width:${progress}%"></i></div><p class="muted">${done}/${pt.length} tareas · Entrega ${date(p.dueDate)}</p><button class="btn alt addTask" data-id="${p.id}">+ Tarea</button><div class="list" style="margin-top:12px">${pt.map(t=>`<div class="row"><span>${esc(t.title)}<small class="muted" style="display:block">${esc(t.assignee||'Sin responsable')} · ${date(t.dueDate)}</small></span><select class="taskStatus" data-id="${t.id}">${['Pendiente','En curso','En revisión','Hecho'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')}</div></article>`}).join(''):'<div class="card empty">Todavía no hay proyectos.</div>'}
function performanceView(){const now=new Date(),start=new Date();start.setDate(now.getDate()-14);const pt=state.tasks.filter(t=>new Date(t.dueDate||t.createdAt?.toDate?.()||0)>=start),done=pt.filter(t=>t.status==='Hecho').length,p=pt.length?Math.round(done/pt.length*100):0,late=pt.filter(t=>t.status!=='Hecho'&&t.dueDate&&new Date(t.dueDate)<now).length;return `<section class="hero"><span>DESEMPEÑO QUINCENAL</span><div><strong>${p}%</strong><p>${done} de ${pt.length} tareas completadas.</p></div><div class="progress"><i style="width:${p}%"></i></div></section><div class="stats" style="margin-top:15px"><div class="card stat"><span class="muted">Tareas del periodo</span><strong>${pt.length}</strong></div><div class="card stat"><span class="muted">Completadas</span><strong>${done}</strong></div><div class="card stat"><span class="muted">Atrasadas</span><strong>${late}</strong></div></div>`}
function goalsView(){return `<div class="grid">${state.goals.length?state.goals.map(g=>{const p=Math.min(100,Math.round((g.current||0)/(g.target||1)*100));return `<article class="card"><span class="tag">Meta ${esc(g.period)}</span><h2>${esc(g.title)}</h2><strong style="font-size:32px">${p}%</strong><div class="progress"><i style="width:${p}%"></i></div><p class="muted">${g.current||0} / ${g.target} ${esc(g.unit||'%')} · ${date(g.dueDate)}</p><input class="goalProgress" data-id="${g.id}" type="number" min="0" value="${g.current||0}"></article>`}).join(''):'<div class="card empty">Todavía no hay metas.</div>'}</div>`}
function feedbackView(){return `<div class="grid">${state.feedback.length?state.feedback.map(f=>`<article class="card"><span class="tag">${esc(f.category)}</span><h2>${esc(f.author)}</h2><div class="stars">${'★'.repeat(f.rating||5)}</div><p>${esc(f.message)}</p><small class="muted">${esc(state.projects.find(p=>p.id===f.projectId)?.name||'Feedback general')}</small></article>`).join(''):'<div class="card empty">Todavía no hay feedback.</div>'}</div>`}
function bindActions(){const s=$('#search');if(s)s.oninput=()=>{$('#projectList').innerHTML=projectRows(state.projects.filter(p=>`${p.name} ${p.client}`.toLowerCase().includes(s.value.toLowerCase())&&($('#statusFilter').value==='Todos'||p.status===$('#statusFilter').value)));bindActions()};const f=$('#statusFilter');if(f)f.onchange=()=>s.dispatchEvent(new Event('input'));document.querySelectorAll('.addTask').forEach(b=>b.onclick=()=>openTask(b.dataset.id));document.querySelectorAll('.taskStatus').forEach(x=>x.onchange=()=>updateDoc(doc(db,'tasks',x.dataset.id),{status:x.value,completedAt:x.value==='Hecho'?serverTimestamp():null}));document.querySelectorAll('.goalProgress').forEach(x=>x.onchange=()=>updateDoc(doc(db,'goals',x.dataset.id),{current:Number(x.value)||0}))}
function openForm(view){if(view==='Proyectos')showModal('Nuevo proyecto',`<label>Nombre<input name="name" required></label><label>Cliente<input name="client"></label><label>Tipo<select name="type"><option>Arquitectura</option><option>Paisajismo</option><option>Piscinas y patios</option><option>Urbanismo</option></select></label><label>Fecha objetivo<input name="dueDate" type="date"></label><label>Alcance<textarea name="description"></textarea></label>`,async d=>addDoc(collection(db,'projects'),{...d,status:'En curso',createdAt:serverTimestamp()}));if(view==='Metas')showModal('Nueva meta',`<label>Meta<input name="title" required></label><label>Periodo<select name="period"><option>Semanal</option><option>Mensual</option></select></label><label>Objetivo numérico<input name="target" type="number" value="100"></label><label>Unidad<input name="unit" value="%"></label><label>Fecha objetivo<input name="dueDate" type="date"></label>`,async d=>addDoc(collection(db,'goals'),{...d,target:Number(d.target)||100,current:0,createdAt:serverTimestamp()}));if(view==='Feedback')showModal('Registrar feedback',`<label>De parte de<input name="author" required></label><label>Proyecto<select name="projectId"><option value="">General</option>${state.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`)}</select></label><label>Origen<select name="category"><option>Cliente</option><option>Equipo</option><option>Revisión</option></select></label><label>Calificación<select name="rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label>Comentario<textarea name="message" required></textarea></label>`,async d=>addDoc(collection(db,'feedback'),{...d,rating:Number(d.rating),createdAt:serverTimestamp()}))}
function openTask(projectId){showModal('Nueva tarea',`<label>Tarea<input name="title" required></label><label>Responsable<input name="assignee"></label><label>Fecha de entrega<input name="dueDate" type="date"></label>`,async d=>addDoc(collection(db,'tasks'),{...d,projectId,status:'Pendiente',createdAt:serverTimestamp(),completedAt:null}))}
function showModal(title,fields,save){$('#modalTitle').textContent=title;$('#dynamicForm').innerHTML=fields+'<button class="btn" type="submit">Guardar</button>';$('#modal').classList.remove('hidden');$('#dynamicForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));await save(d);$('#modal').classList.add('hidden')}}
  </script>
</body></html>
